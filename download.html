<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Savi on the App Store</title>
<!-- Share link for the app (savipeersupport.org/download). It exists so a
     shared link previews with Savi's own share card (og-image.png) instead
     of the generic image Apple generates for App Store links, then sends
     the visitor straight to the App Store. Link previews (iMessage, etc.)
     read the tags below and don't follow the meta refresh. -->
<meta name="description" content="Anonymous peer support, whenever you need to be heard. Free on the App Store.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Savi">
<meta property="og:url" content="https://savipeersupport.org/download">
<meta property="og:title" content="Savi — Real people. Real conversations.">
<meta property="og:description" content="Anonymous peer support, whenever you need to be heard. Free on the App Store.">
<meta property="og:image" content="https://savipeersupport.org/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Savi: Real people. Real conversations. Anonymous peer support.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Savi — Real people. Real conversations.">
<meta name="twitter:description" content="Anonymous peer support, whenever you need to be heard. Free on the App Store.">
<meta name="twitter:image" content="https://savipeersupport.org/og-image.png">
<meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/id6799778881">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#4a5f7e 0%,#3a4c6b 45%,#222b42 100%);color:#eef2f5;
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;text-align:center;padding:24px;}
  a{color:#bcd9d6;}
</style>
</head>
<body>
  <p>Opening the App Store… <br><br><a href="https://apps.apple.com/app/id6799778881">Tap here if nothing happens.</a></p>

</body>
</html>
